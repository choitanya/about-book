<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOIPOKA - Login</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: #f7faf8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            text-decoration: none;
        }

        .logo-icon {
            background-color: #e8f7f0;
            color: #0e8354;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 24px;
            color: #1a1a1a;
            letter-spacing: 1px;
        }

        .login-title {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-subtitle {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .input-box input:focus {
            border-color: #0e8354;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(14, 131, 84, 0.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: #0e8354;
            cursor: pointer;
        }

        .forgot-pass {
            color: #0e8354;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: #0e8354;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(14, 131, 84, 0.25);
        }

        .btn-submit:hover {
            background-color: #0a6641;
            transform: translateY(-1px);
        }

        .signup-link {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: #0e8354;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Brand Logo -->
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <span class="logo-text">BOIPOKA</span>
        </a>

        <h2 class="login-title">স্বাগতম!</h2>
        <p class="login-subtitle">আপনার একাউন্টে লগইন করতে তথ্য দিন</p>

        <form action="#" method="POST">
            <!-- Email / Username -->
            <div class="form-group">
                <label for="email">ইমেইল বা ফোন নম্বর</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="text" id="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">পাসওয়ার্ড</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
 
            <!-- Remember & Forgot Password -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> আমাকে মনে রাখুন
                </label>
                <a href="#" class="forgot-pass">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">লগইন করুন</button>
        </form>

        <!-- Register Link -->
        <div class="signup-link">
            একাউন্ট নেই? <a href="#">নতুন একাউন্ট খুলুন</a>
        </div>
    </div>

</body>
</html>
